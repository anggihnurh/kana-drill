<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow512" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- App icon background — solid near-black -->
  <rect width="512" height="512" rx="128" fill="#09090b" />

  <!-- Subtle inner border -->
  <rect x="6" y="6" width="500" height="500" rx="122" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="4" />

  <!-- Subtle corner accent dots -->
  <circle cx="388" cy="124" r="8" fill="rgba(255,255,255,0.15)" />
  <circle cx="124" cy="388" r="5" fill="rgba(255,255,255,0.1)" />

  <!-- Center Kana Glyph: あ -->
  <text
    x="50%"
    y="56%"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif"
    font-size="290"
    font-weight="900"
    fill="#ffffff"
    filter="url(#shadow512)"
  >あ</text>
</svg>
